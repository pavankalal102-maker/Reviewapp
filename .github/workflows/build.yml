name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Install Dependencies, Capacitor & Assets
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets imagemagick
        
        # Folder structure for assets
        mkdir -p assets
        cp logo.png assets/icon-only.png
        cp logo.png assets/icon-foreground.png
        cp logo.png assets/icon-background.png

        # Create pure solid white splash screen image
        convert -size 2732x2732 xc:#ffffff assets/splash.png
        convert -size 2732x2732 xc:#ffffff assets/splash-dark.png

        # Initialize & Add Android Platform
        npx cap init "BOSS777" "com.boss777.hub" --web-dir .
        npx cap add android

        # Auto Generate App Icon & Solid White Splash Screen
        npx cap-assets generate --android

        # Sync code and assets
        npx cap sync

    - name: Build Android App (APK)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: BOSS777-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
