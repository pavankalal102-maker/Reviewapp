name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare Web Directory
      run: |
        mkdir -p www
        cp index.html www/
        [ -f logo.png ] && cp logo.png www/ || true

    - name: Install Capacitor CLI & Platform
      run: |
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

    - name: Initialize & Sync Capacitor
      run: |
        npx cap init "BOSS777" "com.boss777.hub" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOSS777-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
