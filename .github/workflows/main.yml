name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Dependencies & Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

        mkdir -p assets
        cp logo.png assets/icon-only.png
        cp logo.png assets/icon-foreground.png
        cp logo.png assets/icon-background.png
        cp logo.png assets/splash.png
        cp logo.png assets/splash-dark.png

        npx cap init "BOSS777" "com.boss777.hub" --web-dir .
        npx cap add android

        npx cap-assets generate --android
        npx cap sync

    - name: Build Android App (APK)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOSS777-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
